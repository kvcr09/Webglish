<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webglish</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #FBF5DE; /* Crema */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            padding: 30px 40px 40px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #03658C;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .signin-link {
            text-decoration: none;
            color: #03658C;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .main-content {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .login-card {
            background-color: #FBF5DE;
            border-radius: 20px;
            padding: 30px 25px;
            width: 320px;
            flex-shrink: 0;
        }

        .header-form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-form h2 {
            color: #03658C;
            font-size: 26px;
            font-weight: 700;
        }

        .google-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #03658C;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .google-icon {
            width: 14px;
            height: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #03658C;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px;
            background-color: #EAC8A6;
            border: none;
            border-radius: 12px;
            color: #03658C;
            font-size: 13px;
            font-weight: 500;
            outline: none;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper .input-field {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #03658C;
            font-size: 16px;
            user-select: none;
        }

        .error-message {
            display: none;
            color: #DC3C22;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        .submit-btn {
            width: 100px;
            padding: 10px;
            background-color: #DC3C22;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .login-text {
            text-align: center;
            font-size: 11px;
            color: #03658C;
            font-weight: 600;
        }

        .login-text span {
            color: #03658C;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        .illustration-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration-container img {
            max-width: 100%;
            height: auto;
        }

        /* Modal para Iniciar Sesión */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 101, 140, 0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #FBF5DE;
            border-radius: 20px;
            padding: 35px 30px;
            width: 330px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 18px;
            font-size: 20px;
            font-weight: bold;
            color: #03658C;
            cursor: pointer;
        }

        .modal-card h2 {
            color: #03658C;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Navegación -->
        <nav class="navbar">
            <div class="logo">Webglish</div>
            <div class="nav-actions">
                <span class="signin-link" onclick="openLoginModal()">Sign in</span>
            </div>
        </nav>

        <!-- Contenido principal -->
        <div class="main-content">
            <!-- FORMULARIO PRINCIPAL: SIGN UP (REGISTRO) -->
            <div class="login-card">
                <div class="header-form">
                    <h2>Sign up</h2>
                    <button class="google-btn" type="button" onclick="openGooglePopup()">
                        Sign with
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                    </button>
                </div>

                <form onsubmit="registerUser(event)">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="input-field" placeholder="Sophia Tompson" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email address</label>
                        <input type="email" id="reg-email" class="input-field" placeholder="correo@ejemplo.com" required oninput="hideEmailError()">
                        <div class="error-message" id="emailError">Este correo ya está registrado.</div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-password" class="input-field" placeholder="••••••••" required>
                            <span class="toggle-password" onclick="togglePasswordVisibility('reg-password')">&#128065;</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Sign up</button>
                </form>

                <p class="login-text">
                    Already have an account ? <span onclick="openLoginModal()">Sign in</span>
                </p>
            </div>

            <!-- Ilustración del elefante -->
            <div class="illustration-container">
                <img src="https://illustrations.puchu.pub/assets/images/illustrations/elephant-paper-plane.png" 
                     alt="Elefante en avión de papel" 
                     onerror="this.onerror=null; this.src='https://cdn.pixabay.com/photo/2021/01/29/08/10/musician-5960112_1280.png';"
                     style="max-width: 100%; height: auto;">
            </div>
        </div>
    </div>

    <!-- MODAL DE INICIO DE SESIÓN -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <span class="close-modal" onclick="closeLoginModal()">&times;</span>
            <h2>Sign In</h2>
            
            <form onsubmit="loginUser(event)">
                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <input type="email" id="login-email" class="input-field" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('login-password')">&#128065;</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" style="width: 100%; margin-top: 10px;">Sign in</button>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        function openGooglePopup() {
            const width = 500;
            const height = 600;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            
            window.open(
                'https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fwww.google.com&flowName=GlifWebSignIn&flowEntry=ServiceLogin', 
                'GoogleSignIn', 
                `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`
            );
        }

        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function hideEmailError() {
            document.getElementById('emailError').style.display = 'none';
        }

        // REGISTRO Y VALIDACIÓN DE CORREO DUPLICADO
        function registerUser(event) {
            event.preventDefault();
            
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;

            let users = JSON.parse(localStorage.getItem('webglish_users')) || [];

            // Verificar si el correo ya existe
            const emailExists = users.some(user => user.email === email);

            if (emailExists) {
                document.getElementById('emailError').style.display = 'block';
                return;
            }

            // Guardar usuario
            const newUser = { name: name, email: email, password: password };
            users.push(newUser);
            localStorage.setItem('webglish_users', JSON.stringify(users));

            // Guardar nombre activo y REDIRIGIR AL DASHBOARD
            localStorage.setItem('webglish_userName', name);
            window.location.href = 'dashboard.html';
        }

        // INICIAR SESIÓN
        function loginUser(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            
            let users = JSON.parse(localStorage.getItem('webglish_users')) || [];
            const userFound = users.find(u => u.email === email);

            if (userFound) {
                localStorage.setItem('webglish_userName', userFound.name);
            } else {
                const defaultName = email.split('@')[0];
                localStorage.setItem('webglish_userName', defaultName);
            }

            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
