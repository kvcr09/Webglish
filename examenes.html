<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webglish - Mis Exámenes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { width: 100%; height: 100vh; overflow: hidden; background-color: #EAC8A6; }
        .dashboard-container { background-color: #EAC8A6; width: 100vw; height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 250px; background-color: #F5DEC2; padding: 30px 24px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; height: 100vh; }
        .brand-logo { font-size: 26px; font-weight: 800; color: #03658C; margin-bottom: 25px; }
        .user-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 35px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #03658C; }
        .user-info .user-name { font-size: 14px; font-weight: 700; color: #03658C; }
        .user-info .user-role { font-size: 11px; color: #666; }
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .nav-item a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #03658C; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 14px; transition: 0.2s; }
        .nav-item.active a { background-color: #EAC8A6; }
        .logout-link { margin-top: auto; color: #DC3C22; text-decoration: none; font-weight: 700; font-size: 14px; }
        .main-panel { flex-grow: 1; padding: 35px 40px; display: flex; flex-direction: column; gap: 25px; height: 100vh; overflow-y: auto; }
        .welcome-title { font-size: 26px; font-weight: 800; color: #03658C; text-transform: uppercase; }
        .content-card { background-color: #FBF5DE; border-radius: 20px; padding: 25px; flex-grow: 1; color: #03658C; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div>
                <div class="brand-logo">Webglish</div>
                <div class="user-profile">
                    <img src="https://via.placeholder.com/44/03658C/FFFFFF?text=U" alt="Profile" class="user-avatar">
                    <div class="user-info">
                        <div class="user-name" id="profileName">Student</div>
                        <div class="user-role">Student</div>
                    </div>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="dashboard.html">Inicio</a></li>
                    <li class="nav-item active"><a href="examenes.html">Mis exámenes</a></li>
                    <li class="nav-item"><a href="estadisticas.html">Mis estadísticas</a></li>
                    <li class="nav-item"><a href="nosotros.html">Sobre nosotros</a></li>
                    <li class="nav-item"><a href="configuracion.html">Configuración</a></li>
                </ul>
            </div>
            <a href="index.html" class="logout-link" onclick="localStorage.removeItem('webglish_userName')">Log out</a>
        </aside>

        <main class="main-panel">
            <h1 class="welcome-title">MIS EXÁMENES</h1>
            <div class="content-card">
                <h2>Próximas Evaluaciones</h2>
                <p style="margin-top: 15px;">Aún no tienes exámenes pendientes asignados.</p>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const savedName = localStorage.getItem('webglish_userName');
            if (savedName && savedName.trim() !== "") {
                document.getElementById('profileName').textContent = savedName.trim();
            }
        });
    </script>
</body>
</html>
